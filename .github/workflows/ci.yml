name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So that a run can be started without inventing a commit to carry it.
  workflow_dispatch:

permissions:
  contents: read

# This workflow is the whole gate. `main` is the only long-lived branch and
# maintainers commit straight to it (ADR 0001), so there is no review step
# between a commit and the trunk — what is here is what stands between a mistake
# and `main`. It therefore runs on every push to `main`, on every pull request
# including one from a fork, and on demand; and it has to stay fast enough that
# nobody is tempted to push past it, which is why the toolchains run beside each
# other rather than in one job.
#
# The last job is the odd one out: it does not check a language. It starts the
# product the way an operator does and asks whether it answers.

# One run at a time, and nothing is cancelled. With a single maintainer pushing
# there is nothing to gain from two racing, and a pull request waiting a few
# minutes behind the trunk costs less than jobs interleaving over one registry
# or one cache.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  # Whitespace, using directives and the naming rules of .editorconfig, checked
  # rather than asked for. It is its own job because it is the fastest of them:
  # a formatting slip should be red before the test jobs have finished pulling
  # a Postgres image.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Vaultaffe.slnx
      - run: dotnet format Vaultaffe.slnx --verify-no-changes

      # The other language an operator runs directly. Two scripts, on the path
      # where being wrong loses an installation (ADR 0017) — and the round trip
      # in the last job exercises what they do, not how they quote it.
      - name: The operator's shell
        run: shellcheck deploy/*.sh

  # Seconds, and nothing installed: the rules of Domain and the use cases of
  # Application against substituted ports, plus the layering test that reads the
  # four project files and fails a reference pointing outward (ADR 0002).
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Vaultaffe.slnx
      - run: dotnet build Vaultaffe.slnx -c Release --no-restore
      - run: dotnet test tests/Vaultaffe.UnitTests -c Release --no-build

  # The parts no substitute can vouch for: that the migrations apply, that a
  # value survives a round trip through the envelope encryption, that the
  # organization filter cannot be stepped around. Testcontainers brings up the
  # Postgres, so this job needs the Docker the runner already has and nothing
  # else declared here.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Vaultaffe.slnx
      - run: dotnet build Vaultaffe.slnx -c Release --no-restore
      - run: dotnet test tests/Vaultaffe.IntegrationTests -c Release --no-build

  # The document both the reader and the generated web client take the API from
  # (ADR 0006), captured from an installation that is actually running rather
  # than from a build that was asked what it would serve. `ContractTests` makes
  # the same comparison from the other side, against Testcontainers; this one
  # makes it against an installation started the way an operator starts one, so
  # that neither the test nor the capture can be the only thing that was right.
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: vaultaffe
          POSTGRES_USER: vaultaffe
          POSTGRES_PASSWORD: vaultaffe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultaffe -d vaultaffe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # An empty database and no migration step: the installation applies its own
      # migrations on start (Specification §6.3), so a schema this job prepared
      # would be a second place that creates one.
      #
      # The master key is generated here and thrown away with the runner. It
      # encrypts nothing — this installation serves one document and takes no
      # value — but an instance without a usable one does not start, which is the
      # behaviour under test everywhere else.
      - name: Start the installation
        run: |
          set -euo pipefail
          export Vaultaffe__MasterKey="$(openssl rand -base64 32)"
          dotnet run --project src/Vaultaffe.Api -c Release --no-launch-profile &
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=vaultaffe;Username=vaultaffe;Password=vaultaffe
          ASPNETCORE_HTTP_PORTS: "5142"

      - name: Capture the contract
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            curl --fail --silent http://localhost:5142/openapi/v1.json -o /tmp/openapi.json && break
            sleep 2
          done
          test -s /tmp/openapi.json || { echo "the installation never served a document"; exit 1; }
          # Formatted by the json module rather than by json.tool, whose --indent
          # flag is not in every Python the runner might carry. ensure_ascii off,
          # so that a dash in a summary stays a dash, as ContractTests writes it.
          python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("/tmp/openapi.json").read_text(encoding="utf-8")); pathlib.Path("docs/api/openapi.json").write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")'

      - name: The checked-in contract is the one being served
        run: git diff --exit-code -- docs/api/openapi.json

  # No generation step here on purpose. The API layer is generated from
  # `docs/api/openapi.json` before typecheck, test and build (ADR 0006), and
  # that belongs in the package's own scripts rather than in this file —
  # otherwise CI runs against a freshly generated client and a contributor runs
  # against whatever is in their working tree.
  #
  # The build is checked into a directory of its own rather than into the API's
  # `wwwroot`: what is being asked here is whether it builds, and a job that
  # left an artifact in the source tree would be answering a different question.
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build -- --outDir dist --emptyOutDir

  # `vaultaffe` is a client of the public API and references nothing in `src/`
  # (Specification §9), so it is a plain Go module built by a plain Go job. The
  # toolchain version comes from its own `go.mod` rather than from a number
  # pinned here, which is the only way the two cannot disagree.
  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum

      # The client of the contract is generated and not committed (ADR 0011), so
      # it is generated here before anything reads it — from the same
      # `docs/api/openapi.json` this workflow verifies a running instance
      # against in the job above. A CLI that compiles here is a CLI that
      # compiles against the contract the instance actually serves.
      - name: Generate the API client
        run: go generate ./...

      # gofmt has no --check, and it reports by printing names: a non-empty
      # listing is the failure. This is the Go half of the `format` job above.
      - name: Format
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || {
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          }

      - run: go vet ./...
      - run: go test ./...
      # Compilation of every package, not the release binaries. Those are cut
      # per platform from a tag, and a trunk build has no tag to be named after.
      - run: go build ./...

  # The whole thing, started the way an operator starts it: one image carrying
  # the API and the built SPA (ADR 0016), Caddy in front of it, Postgres behind
  # it. Everything above this asks whether a part compiles; this asks whether
  # the parts run together, which is the success criterion of `git clone` to a
  # running instance (Specification §11) and the one thing no test inside any of
  # the three toolchains can answer.
  #
  # It pushes nothing. Publishing an image is a release, it happens from a tag,
  # and this workflow runs on every commit.
  image:
    name: Image and stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # Loaded into the runner's daemon for the steps below rather than
          # pushed, which is also why there is no attestation: a manifest list
          # carrying one is not a thing `docker compose` can run.
          load: true
          provenance: false
          tags: vaultaffe:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The two values an operator fills in, generated here and thrown away with
      # the runner. They protect nothing — this installation holds one account
      # for the length of a job — but an instance without a usable master key
      # does not start, which is the behaviour everything below relies on.
      #
      # Written and never echoed: a workflow that printed a master key would be
      # the product rule of `AGENTS.md` broken by this project's own CI.
      - name: An instance configuration
        run: |
          set -euo pipefail
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "VAULTAFFE_MASTER_KEY=$(openssl rand -base64 32)"
          } > deploy/.env

      - name: Bring the stack up
        run: docker compose -f deploy/docker-compose.yml up -d --wait
        env:
          VAULTAFFE_IMAGE: vaultaffe:ci
          # Not 80 and 443: nothing here asks for a certificate, and moving them
          # is the same override an operator behind another proxy uses.
          VAULTAFFE_HTTP_PORT: "8080"
          VAULTAFFE_HTTPS_PORT: "8443"

      # Through Caddy, which is the only way in: the instance publishes no port
      # of its own and is not meant to.
      - name: It answers, and it is the product rather than only the API
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/api/handshake | grep -q '"apiVersions"'
          curl --fail --silent http://localhost:8080/ | grep -q 'id="root"'

      # An installation that has not been started says so, and starting it is
      # the first run: the one request that needs no credential, and the one
      # that refuses the second time (ADR 0007).
      - name: The first run happens, and happens once
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8080/api/v1/instance | grep -q '"started":false'
          curl --fail --silent -X POST http://localhost:8080/api/v1/instance \
            -H 'content-type: application/json' \
            -d '{"email":"maintainer@example.test","name":"Maintainer","password":"a-password-of-real-length"}' \
            -o /dev/null
          again="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8080/api/v1/instance \
            -H 'content-type: application/json' \
            -d '{"email":"somebody@example.test","name":"Somebody Else","password":"a-password-of-real-length"}')"
          test "$again" = "409" || { echo "the second first run answered $again"; exit 1; }

      # A backup nobody has restored is a belief, so the round trip runs here on
      # every commit (ADR 0017): a value is written, the artifact is taken, the
      # installation is destroyed with `down -v` — both halves, the volume and
      # the `.env` — and the value is read back out of the artifact alone.
      #
      # The value is generated here and masked, and only its checksum crosses
      # between steps. A workflow that printed one would be this project's own
      # product rule broken by its CI (Specification §6.5).
      - name: A value to lose
        run: |
          set -euo pipefail
          token="$(curl --fail --silent -X POST http://localhost:8080/api/v1/sessions \
            -H 'content-type: application/json' \
            -d '{"email":"maintainer@example.test","password":"a-password-of-real-length"}' \
            | jq -r .token)"
          echo "::add-mask::$token"
          curl --fail --silent -X POST http://localhost:8080/api/v1/projects \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"name":"checkout"}' -o /dev/null
          value="sk_$(openssl rand -hex 16)"
          echo "::add-mask::$value"
          curl --fail --silent -X PUT \
            http://localhost:8080/api/v1/projects/checkout/environments/prod/secrets/STRIPE_KEY \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d "{\"value\":\"$value\"}" -o /dev/null
          printf '%s' "$value" | sha256sum | cut -d' ' -f1 > /tmp/value.sha256

      - name: Take a backup, and destroy the installation
        run: |
          set -euo pipefail
          deploy/backup.sh /tmp > /tmp/artifact
          docker compose -f deploy/docker-compose.yml down -v
          rm deploy/.env
        env:
          VAULTAFFE_IMAGE: vaultaffe:ci
          VAULTAFFE_HTTP_PORT: "8080"
          VAULTAFFE_HTTPS_PORT: "8443"

      # One command, on a machine that now has neither the data nor the key.
      # Nothing brings the stack up first: that is what a restore onto a new
      # host is, and it is the case worth exercising.
      - name: Restore it, and the value is the one that was written
        run: |
          set -euo pipefail
          deploy/restore.sh "$(cat /tmp/artifact)" --yes
          token="$(curl --fail --silent -X POST http://localhost:8080/api/v1/sessions \
            -H 'content-type: application/json' \
            -d '{"email":"maintainer@example.test","password":"a-password-of-real-length"}' \
            | jq -r .token)"
          echo "::add-mask::$token"
          value="$(curl --fail --silent \
            http://localhost:8080/api/v1/projects/checkout/environments/prod/secrets/STRIPE_KEY \
            -H "authorization: Bearer $token" | jq -r .value)"
          echo "::add-mask::$value"
          printf '%s' "$value" | sha256sum | cut -d' ' -f1 > /tmp/value.restored
          cmp --silent /tmp/value.sha256 /tmp/value.restored || {
            echo "the restored value is not the one that was written"
            exit 1
          }
        env:
          VAULTAFFE_IMAGE: vaultaffe:ci
          VAULTAFFE_HTTP_PORT: "8080"
          VAULTAFFE_HTTPS_PORT: "8443"

      - name: What the stack said, if any of that failed
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Take it down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
